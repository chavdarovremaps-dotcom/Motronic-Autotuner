[project]
name = "motronic-autotuner"
version = "0.1.0"
description = "Log-to-map calibration tool for Bosch Motronic and Siemens ECUs"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "PySide6>=6.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
motronic-me7 = "motronic_autotuner.apps.me7:main"
motronic-ms43 = "motronic_autotuner.apps.ms43:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["motronic_autotuner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
